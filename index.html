<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Blazzing - Playable Demo</title>
  <!-- Cache-bust updated to force browsers to fetch newest JS/CSS -->
  <link rel="stylesheet" href="style.css?v=20260816T205900">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game"></canvas>

    <!-- Mobile / touch controls -->
    <div id="touch-controls">
      <button id="leftBtn" class="ctl">◀</button>
      <button id="rightBtn" class="ctl">▶</button>
      <button id="jumpBtn" class="ctl jump">▲</button>
    </div>

    <div id="info">Use left/right arrows or touch buttons. Press Up arrow or Space to jump.</div>
  </div>

  <script src="game.js?v=20260816T205900"></script>
</body>
</html>
